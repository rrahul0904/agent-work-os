name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_work_os
          POSTGRES_PASSWORD: agent_work_os_test
          POSTGRES_DB: agent_work_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_work_os -d agent_work_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_WORK_OS_TEST_DATABASE_URL: postgres://agent_work_os:agent_work_os_test@localhost:5432/agent_work_os_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full-history secrets (redacted)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.24.3 detect
          --source=/repo --redact --exit-code=2 --log-opts="--all"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Check browser workspace JavaScript syntax
        run: node --check apps/web/public/app.js
      - run: npm test
      - run: npm run acceptance

name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agent_work_os
          POSTGRES_PASSWORD: agent_work_os_test
          POSTGRES_DB: agent_work_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_work_os -d agent_work_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_WORK_OS_TEST_DATABASE_URL: postgres://agent_work_os:agent_work_os_test@localhost:5432/agent_work_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run acceptance
      - name: Research Ledger v0.3 local acceptance
        working-directory: labs/research-ledger
        run: npm run check
      - name: REA intake 229 official Reddit info probe
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const share = 'https://www.reddit.com/r/BestGitHubRepos/s/EjKhT844dz';
          const endpoint = new URL('https://www.reddit.com/api/info.json');
          endpoint.searchParams.set('url', share);
          endpoint.searchParams.set('raw_json', '1');
          const response = await fetch(endpoint, {
            redirect: 'manual',
            headers: {
              'accept': 'application/json',
              'user-agent': 'linux:agent-work-os:0.1 (read-only REA source identity; by u/rrahul0904)'
            }
          });
          const text = await response.text();
          console.log(JSON.stringify({
            status: response.status,
            location: response.headers.get('location'),
            contentType: response.headers.get('content-type'),
            bodyPreview: text.slice(0, 4000)
          }, null, 2));
          NODE

name: Visual Intelligence Phase A

on:
  push:
    branches:
      - feat/visual-intelligence-platform
  pull_request:
    paths:
      - 'labs/visual-intelligence-platform/**'
      - 'contracts/visual-intelligence-platform.phase-a.json'
      - 'docs/reverse-engineering/visual-intelligence-platform.md'
      - 'docs/reverse-engineering/visual-intelligence-donor-register.md'
      - '.github/workflows/visual-intelligence-phase-a.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test platform core
        working-directory: labs/visual-intelligence-platform
        run: npm test
      - name: Syntax check hosted runtime
        working-directory: labs/visual-intelligence-platform
        run: node --check server.mjs
      - name: Build hosted shell
        working-directory: labs/visual-intelligence-platform
        run: npm run build
      - name: Verify static artifact
        working-directory: labs/visual-intelligence-platform
        run: |
          test -f dist/index.html
          test -f dist/prompt-core.mjs
          test -f dist/entitlements.mjs
          test -f dist/orchestrator.mjs
          test -f dist/visualbench.mjs
          test -f dist/diagram-spec.mjs
          test -f dist/diagram-renderer.mjs
          test -f dist/diagram-critic.mjs
          test -f dist/diagram-adapters.mjs
          test -f dist/deck-plan.mjs
          test -f dist/pptx-native.mjs
          test -f dist/creative-spec.mjs
          test -f dist/creative-renderer.mjs
          test -f dist/studio-upgrade.mjs
          grep -q 'studio-upgrade.mjs' dist/index.html
      - name: Smoke hosted runtime
        working-directory: labs/visual-intelligence-platform
        run: |
          PORT=4173 node server.mjs >/tmp/visual-intelligence-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/health.json; then READY=1; break; fi
            sleep 0.25
          done
          if test "$READY" != "1"; then cat /tmp/visual-intelligence-server.log; exit 1; fi
          grep -q '"ok":true' /tmp/health.json
          grep -q '"diagram-spec"' /tmp/health.json
          grep -q '"native-pptx"' /tmp/health.json
          grep -q '"creative-spec"' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'Diagram Studio'
          curl -fsS -X POST http://127.0.0.1:4173/api/prompt -H 'content-type: application/json' --data '{"artifactType":"architecture-diagram","objective":"Show a secure multi-region RAG platform","plan":"community"}' >/tmp/prompt.json
          grep -q '"promptSpec"' /tmp/prompt.json
          grep -q '"runPlan"' /tmp/prompt.json
          cat >/tmp/diagram.json <<'JSON'
          {"kind":"rag","title":"Secure RAG","nodes":[{"id":"user","type":"actor","label":"User","evidence":"requirements"},{"id":"idp","type":"identity","label":"IdP","evidence":"security"},{"id":"svc","type":"service","label":"RAG Service","evidence":"repo"},{"id":"kb","type":"dataset","label":"Knowledge","boundary":"data","evidence":"model"},{"id":"llm","type":"model","label":"LLM","evidence":"provider"}],"edges":[{"from":"user","to":"idp","label":"auth","protocol":"OIDC","evidence":"security"},{"from":"idp","to":"svc","label":"token","protocol":"HTTPS","evidence":"security"},{"from":"svc","to":"kb","label":"retrieve","evidence":"model"},{"from":"svc","to":"llm","label":"generate","evidence":"provider"}]}
          JSON
          curl -fsS -X POST http://127.0.0.1:4173/api/diagram -H 'content-type: application/json' --data-binary @/tmp/diagram.json >/tmp/diagram-response.json
          grep -q '"diagramSpec"' /tmp/diagram-response.json
          grep -q '"svg"' /tmp/diagram-response.json
          grep -q 'flowchart LR' /tmp/diagram-response.json
          grep -q '@startuml' /tmp/diagram-response.json
          grep -q '<mxfile' /tmp/diagram-response.json
          cat >/tmp/deck.json <<'JSON'
          {"title":"Enterprise AI Platform","slides":[{"title":"Enterprise AI Platform","subtitle":"Governed visual intelligence","layout":"title"},{"title":"Why now","bullets":["Editable artifacts","Governed agents","Evidence-backed review"]}]}
          JSON
          curl -fsS -X POST 'http://127.0.0.1:4173/api/presentation?mode=receipt' -H 'content-type: application/json' --data-binary @/tmp/deck.json >/tmp/deck-receipt.json
          grep -q '"editable":true' /tmp/deck-receipt.json
          curl -fsS -X POST http://127.0.0.1:4173/api/presentation -H 'content-type: application/json' --data-binary @/tmp/deck.json -o /tmp/visual-intelligence.pptx
          python3 - <<'PY'
          import zipfile
          path='/tmp/visual-intelligence.pptx'
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              required={'[Content_Types].xml','ppt/presentation.xml','ppt/slides/slide1.xml','ppt/slides/slide2.xml','ppt/theme/theme1.xml'}
              assert required <= names, required-names
              slide=z.read('ppt/slides/slide2.xml').decode('utf-8')
              assert 'Editable artifacts' in slide
              assert '<p:sp>' in slide and '<a:t>' in slide
          PY
          curl -fsS -X POST http://127.0.0.1:4173/api/creative -H 'content-type: application/json' --data '{"format":"landscape","headline":"Architecture that stays editable","body":"Semantic artifacts with governed agents","cta":"Build now"}' >/tmp/creative.json
          grep -q '"creativeSpec"' /tmp/creative.json
          grep -q '"editable":true' /tmp/creative.json
          grep -q 'id=\"headline\"' /tmp/creative.json

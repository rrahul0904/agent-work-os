name: n8n REA gates

on:
  pull_request:
    paths:
      - 'commercialization/n8n/**'
      - '.github/workflows/n8n-rea-gates.yml'
  push:
    branches:
      - 'commercialize/n8n-product-store'
    paths:
      - 'commercialization/n8n/**'
      - '.github/workflows/n8n-rea-gates.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run REA and release-factory tests
        working-directory: commercialization/n8n/tools
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Validate canonical 20-product release registry
        working-directory: commercialization/n8n/tools
        run: python release_factory.py validate-registry ../release_registry.json
